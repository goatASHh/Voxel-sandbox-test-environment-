name: Build POCO F6 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'experiment/tree-generation' ]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'assets/**'
      - 'Poco_Voxel_Sandbox_Dev10_Dev11_working_source*.zip'

permissions:
  contents: read

concurrency:
  group: poco-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Full Rust test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Unpack uploaded game source ZIP
        shell: bash
        run: |
          ARCHIVE="$(find . -maxdepth 1 -type f -iname 'Poco_Voxel_Sandbox_Dev10_Dev11_working_source*.zip' | head -n 1)"
          if [ -n "$ARCHIVE" ]; then
            mkdir -p /tmp/poco-source
            unzip -q "$ARCHIVE" -d /tmp/poco-source
            CARGO_FILE="$(find /tmp/poco-source -mindepth 1 -maxdepth 3 -type f -name Cargo.toml -print -quit)"
            if [ -z "$CARGO_FILE" ]; then
              echo "::error::The uploaded ZIP does not contain a Cargo.toml project."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$CARGO_FILE")"
            rsync -a --exclude='.github' "$PROJECT_DIR/" ./
          fi
          test -f Cargo.toml && test -d src

      - name: Prepare experimental tree-friendly spawn biome
        if: github.ref_name == 'experiment/tree-generation'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/terrain.rs")
          s = p.read_text()
          old = "else if moisture < -0.38 && climate > -0.05 { Biome::Desert }"
          new = "else if moisture < -0.38 && climate > 0.30 { Biome::Desert }"
          if old not in s:
              raise SystemExit("Expected biome rule was not found; refusing to alter unknown terrain code.")
          p.write_text(s.replace(old, new, 1))
          print("Experimental spawn biome adjusted: starting region is no longer forced into desert.")
          PY

      - name: Apply Macroquad API and Rust type fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.rs")
          s = p.read_text()
          s = s.replace("            near: 0.1,", "            z_near: 0.1,")
          s = s.replace("            far: 500.0,", "            z_far: 500.0,")
          s = s.replace("draw_line(cx - 9.0, cy, cx + 9.0, cy, WHITE, 2.0)", "draw_line(cx - 9.0, cy, cx + 9.0, cy, 2.0, WHITE)")
          s = s.replace("draw_line(cx, cy - 9.0, cx, cy + 9.0, WHITE, 2.0)", "draw_line(cx, cy - 9.0, cx, cy + 9.0, 2.0, WHITE)")
          p.write_text(s)
          p = Path("src/terrain.rs")
          s = p.read_text().replace("let radius =", "let radius: i32 =")
          p.write_text(s)
          p = Path("src/renderer.rs")
          s = p.read_text().replace("Vertex { position, uv: vec2(0.0, 0.0), color }", "Vertex { position, uv: vec2(0.0, 0.0), color, normal: vec4(0.0, 0.0, 0.0, 0.0) }")
          p.write_text(s)
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Run complete Rust unit test suite
        run: cargo test --locked

  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Unpack uploaded game source ZIP
        shell: bash
        run: |
          ARCHIVE="$(find . -maxdepth 1 -type f -iname 'Poco_Voxel_Sandbox_Dev10_Dev11_working_source*.zip' | head -n 1)"
          if [ -n "$ARCHIVE" ]; then
            mkdir -p /tmp/poco-source
            unzip -q "$ARCHIVE" -d /tmp/poco-source
            CARGO_FILE="$(find /tmp/poco-source -mindepth 1 -maxdepth 3 -type f -name Cargo.toml -print -quit)"
            if [ -z "$CARGO_FILE" ]; then
              echo "::error::The uploaded ZIP does not contain a Cargo.toml project."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$CARGO_FILE")"
            rsync -a --exclude='.github' "$PROJECT_DIR/" ./
          fi

      - name: Inspect Android manifest and Rust tests
        shell: bash
        run: |
          echo '--- Cargo.toml ---'
          nl -ba Cargo.toml | sed -n '1,140p'
          echo '--- Rust test locations ---'
          grep -R -n '#\[test\]\|tree_blocks_are_part_of_generated_world' src || true
          echo '--- Full terrain generation and tree test source ---'
          nl -ba src/terrain.rs | sed -n '1,280p'
          echo '--- Block ID definitions ---'
          nl -ba src/block.rs | sed -n '1,240p'
          echo '--- Chunk storage and raw_blocks ---'
          nl -ba src/chunk.rs | sed -n '1,180p'
          echo '--- Android metadata keys ---'
          grep -nE 'package|label|assets|build_targets|sdk' Cargo.toml || true

      - name: Verify Rust project is at repository root
        run: |
          if [ ! -f Cargo.toml ] || [ ! -d src ]; then
            echo "::error::Upload the project contents so Cargo.toml and src/ are at the repository root."
            exit 1
          fi

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android SDK package installation failed after 4 attempts."
              exit 1
            fi
            echo "SDK download failed (attempt $attempt); retrying in 20 seconds..."
            sleep 20
          done

      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Prepare experimental tree-friendly spawn biome
        if: github.ref_name == 'experiment/tree-generation'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/terrain.rs")
          s = p.read_text()
          old = "else if moisture < -0.38 && climate > -0.05 { Biome::Desert }"
          new = "else if moisture < -0.38 && climate > 0.30 { Biome::Desert }"
          if old not in s:
              raise SystemExit("Expected biome rule was not found; refusing to alter unknown terrain code.")
          p.write_text(s.replace(old, new, 1))
          print("Experimental spawn biome adjusted: starting region is no longer forced into desert.")
          PY

      - name: Apply Macroquad API and Rust type fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.rs")
          s = p.read_text()
          s = s.replace("            near: 0.1,", "            z_near: 0.1,")
          s = s.replace("            far: 500.0,", "            z_far: 500.0,")
          s = s.replace("draw_line(cx - 9.0, cy, cx + 9.0, cy, WHITE, 2.0)", "draw_line(cx - 9.0, cy, cx + 9.0, cy, 2.0, WHITE)")
          s = s.replace("draw_line(cx, cy - 9.0, cx, cy + 9.0, WHITE, 2.0)", "draw_line(cx, cy - 9.0, cx, cy + 9.0, 2.0, WHITE)")
          p.write_text(s)
          p = Path("src/terrain.rs")
          s = p.read_text().replace("let radius =", "let radius: i32 =")
          p.write_text(s)
          p = Path("src/renderer.rs")
          s = p.read_text().replace("Vertex { position, uv: vec2(0.0, 0.0), color }", "Vertex { position, uv: vec2(0.0, 0.0), color, normal: vec4(0.0, 0.0, 0.0, 0.0) }")
          p.write_text(s)
          PY
          grep -nE 'near:|far:|draw_line\(cx|let radius|Vertex \{ position' src/main.rs src/terrain.rs src/renderer.rs

      - name: Remove unsupported nested Android application metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Cargo.toml")
          lines = p.read_text().splitlines()
          try:
              start = lines.index("[package.metadata.android.application]")
          except ValueError:
              start = None
          if start is not None:
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("[")), len(lines))
              del lines[start:end]
              p.write_text("\\n".join(lines) + "\\n")
          PY
          sed -i 's/^package = /package_name = /' Cargo.toml
          echo '--- Normalized Android metadata ---'
          sed -n '24,40p' Cargo.toml

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk --locked

      - name: Build Android ARM64 APK
        run: cargo --locked quad-apk build --release

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          APK="$(find target -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was generated. Build output follows:"
            find target -maxdepth 8 -type f | sort | tail -n 160
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'experiment/tree-generation' && 'poco-voxel-sandbox-tree-experiment-arm64-apk' || 'poco-voxel-sandbox-arm64-apk' }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
