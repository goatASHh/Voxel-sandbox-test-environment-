name: Build POCO F6 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'experiment/tree-generation' ]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'assets/**'
      - 'Poco_Voxel_Sandbox_Dev10_Dev11_working_source*.zip'

permissions:
  contents: read

concurrency:
  group: poco-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Full Rust test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Unpack uploaded game source ZIP
        shell: bash
        run: |
          ARCHIVE="$(find . -maxdepth 1 -type f -iname 'Poco_Voxel_Sandbox_Dev10_Dev11_working_source*.zip' | head -n 1)"
          if [ -n "$ARCHIVE" ]; then
            mkdir -p /tmp/poco-source
            unzip -q "$ARCHIVE" -d /tmp/poco-source
            CARGO_FILE="$(find /tmp/poco-source -mindepth 1 -maxdepth 3 -type f -name Cargo.toml -print -quit)"
            if [ -z "$CARGO_FILE" ]; then
              echo "::error::The uploaded ZIP does not contain a Cargo.toml project."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$CARGO_FILE")"
            rsync -a --exclude='.github' "$PROJECT_DIR/" ./
          fi
          test -f Cargo.toml && test -d src

      - name: Prepare experimental tree-friendly spawn biome
        if: github.ref_name == 'experiment/tree-generation'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/terrain.rs")
          s = p.read_text()
          old = "else if moisture < -0.38 && climate > -0.05 { Biome::Desert }"
          new = "else if moisture < -0.38 && climate > 0.30 { Biome::Desert }"
          if old not in s:
              raise SystemExit("Expected biome rule was not found; refusing to alter unknown terrain code.")
          p.write_text(s.replace(old, new, 1))
          print("Experimental spawn biome adjusted: starting region is no longer forced into desert.")
          PY

      - name: Apply Macroquad API and Rust type fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.rs")
          s = p.read_text()
          s = s.replace("            near: 0.1,", "            z_near: 0.1,")
          s = s.replace("            far: 500.0,", "            z_far: 500.0,")
          s = s.replace("draw_line(cx - 9.0, cy, cx + 9.0, cy, WHITE, 2.0)", "draw_line(cx - 9.0, cy, cx + 9.0, cy, 2.0, WHITE)")
          s = s.replace("draw_line(cx, cy - 9.0, cx, cy + 9.0, WHITE, 2.0)", "draw_line(cx, cy - 9.0, cx, cy + 9.0, 2.0, WHITE)")
          p.write_text(s)
          p = Path("src/terrain.rs")
          s = p.read_text().replace("let radius =", "let radius: i32 =")
          p.write_text(s)
          p = Path("src/renderer.rs")
          s = p.read_text().replace("Vertex { position, uv: vec2(0.0, 0.0), color }", "Vertex { position, uv: vec2(0.0, 0.0), color, normal: vec4(0.0, 0.0, 0.0, 0.0) }")
          p.write_text(s)
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Run complete Rust unit test suite
        run: cargo test --locked

  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Unpack uploaded game source ZIP
        shell: bash
        run: |
          ARCHIVE="$(find . -maxdepth 1 -type f -iname 'Poco_Voxel_Sandbox_Dev10_Dev11_working_source*.zip' | head -n 1)"
          if [ -n "$ARCHIVE" ]; then
            mkdir -p /tmp/poco-source
            unzip -q "$ARCHIVE" -d /tmp/poco-source
            CARGO_FILE="$(find /tmp/poco-source -mindepth 1 -maxdepth 3 -type f -name Cargo.toml -print -quit)"
            if [ -z "$CARGO_FILE" ]; then
              echo "::error::The uploaded ZIP does not contain a Cargo.toml project."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$CARGO_FILE")"
            rsync -a --exclude='.github' "$PROJECT_DIR/" ./
          fi

      - name: Inspect Android manifest and Rust tests
        shell: bash
        run: |
          echo '--- Cargo.toml ---'
          nl -ba Cargo.toml | sed -n '1,140p'
          echo '--- Rust test locations ---'
          grep -R -n '#\[test\]\|tree_blocks_are_part_of_generated_world' src || true
          echo '--- Full terrain generation and tree test source ---'
          nl -ba src/terrain.rs | sed -n '1,280p'
          echo '--- Block ID definitions ---'
          nl -ba src/block.rs | sed -n '1,240p'
          echo '--- Chunk storage and raw_blocks ---'
          nl -ba src/chunk.rs | sed -n '1,180p'
          echo '--- Android metadata keys ---'
          grep -nE 'package|label|assets|build_targets|sdk' Cargo.toml || true

      - name: Verify Rust project is at repository root
        run: |
          if [ ! -f Cargo.toml ] || [ ! -d src ]; then
            echo "::error::Upload the project contents so Cargo.toml and src/ are at the repository root."
            exit 1
          fi

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install Java 17 JDK for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if sdkmanager --install "platform-tools" "platforms;android-29" "platforms;android-30" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android SDK package installation failed after 4 attempts."
              exit 1
            fi
            echo "SDK download failed (attempt $attempt); retrying in 20 seconds..."
            sleep 20
          done

      # cargo-quad-apk 0.1.4 expects the Java 8 runtime archive (rt.jar).
      # Install Java 8 only after sdkmanager has completed, because current
      # Android command-line tools require Java 17 or newer.
      - name: Install Java 8 JDK for legacy APK packager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # cargo-quad-apk 0.1.4 still invokes the removed dx interface.
      # Modern Android Build Tools ship d8 instead; adapt the old arguments
      # and place its dex output where the legacy packager expects it.
      - name: Add legacy dx compatibility wrapper
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/d8"
          cat > "$BUILD_TOOLS/dx" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          TOOL_DIR="$(cd "$(dirname "$0")" && pwd)"
          OUTPUT=""
          MIN_API="1"
          INPUTS=()
          while (($#)); do
            case "$1" in
              --dex) shift ;;
              --output=*) OUTPUT="${1#*=}"; shift ;;
              --output) OUTPUT="$2"; shift 2 ;;
              --min-sdk-version) MIN_API="$2"; shift 2 ;;
              --min-sdk-version=*) MIN_API="${1#*=}"; shift ;;
              *) INPUTS+=("$1"); shift ;;
            esac
          done
          if [[ -z "$OUTPUT" || ${#INPUTS[@]} -eq 0 ]]; then
            echo "dx compatibility wrapper: missing output or input" >&2
            exit 2
          fi
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          "$TOOL_DIR/d8" --min-api "$MIN_API" --output "$TMP" "${INPUTS[@]}"
          mkdir -p "$(dirname "$OUTPUT")"
          if [[ ! -f "$TMP/classes.dex" ]]; then
            echo "d8 did not produce classes.dex" >&2
            find "$TMP" -maxdepth 1 -type f -print >&2
            exit 1
          fi
          cp "$TMP/classes.dex" "$OUTPUT"
          SH
          chmod +x "$BUILD_TOOLS/dx"
          echo "Installed dx-to-d8 compatibility wrapper at $BUILD_TOOLS/dx"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Add Android NDK linker compatibility wrapper
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN_BIN/llvm-ar"
          test -x "$TOOLCHAIN_BIN/llvm-readelf"
          test -x "$TOOLCHAIN_BIN/ld.lld"
          test -x "$TOOLCHAIN_BIN/aarch64-linux-android29-clang"
          ln -sf llvm-ar "$TOOLCHAIN_BIN/aarch64-linux-android-ar"
          # Rust's Android target tooling expects a target-prefixed readelf name,
          # while modern NDKs provide the generic LLVM binary.
          ln -sf llvm-readelf "$TOOLCHAIN_BIN/aarch64-linux-android-readelf"
          # Rust/cargo-quad-apk supplies GNU ld flags directly. Clang needs
          # linker-only options forwarded with -Wl, while still supplying the
          # Android sysroot and runtime library search paths.
          cat > "$TOOLCHAIN_BIN/aarch64-linux-android-ld" <<'WRAPPER'
          #!/usr/bin/env python3
          import os
          import sys
          clang = os.path.join(os.path.dirname(os.path.realpath(__file__)), "aarch64-linux-android29-clang")
          source = sys.argv[1:]
          forwarded = []
          i = 0
          while i < len(source):
              arg = source[i]
              if arg == "-z" and i + 1 < len(source):
                  forwarded.append("-Wl,-z," + source[i + 1])
                  i += 2
                  continue
              if arg == "-strip-all":
                  forwarded.append("-Wl,--strip-all")
              elif arg.startswith("--"):
                  forwarded.append("-Wl," + arg)
              else:
                  forwarded.append(arg)
              i += 1
          os.execv(clang, [clang, *forwarded])
          WRAPPER
          chmod +x "$TOOLCHAIN_BIN/aarch64-linux-android-ld"
          test -x "$TOOLCHAIN_BIN/aarch64-linux-android-ld"
          echo "Android NDK tools and linker wrapper verified:"
          ls -l "$TOOLCHAIN_BIN/llvm-ar" "$TOOLCHAIN_BIN/aarch64-linux-android29-clang" "$TOOLCHAIN_BIN/aarch64-linux-android-ld"

      - name: Prepare experimental tree-friendly spawn biome
        if: github.ref_name == 'experiment/tree-generation'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/terrain.rs")
          s = p.read_text()
          old = "else if moisture < -0.38 && climate > -0.05 { Biome::Desert }"
          new = "else if moisture < -0.38 && climate > 0.30 { Biome::Desert }"
          if old not in s:
              raise SystemExit("Expected biome rule was not found; refusing to alter unknown terrain code.")
          p.write_text(s.replace(old, new, 1))
          print("Experimental spawn biome adjusted: starting region is no longer forced into desert.")
          PY

      - name: Apply Macroquad API and Rust type fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.rs")
          s = p.read_text()
          s = s.replace("            near: 0.1,", "            z_near: 0.1,")
          s = s.replace("            far: 500.0,", "            z_far: 500.0,")
          s = s.replace("draw_line(cx - 9.0, cy, cx + 9.0, cy, WHITE, 2.0)", "draw_line(cx - 9.0, cy, cx + 9.0, cy, 2.0, WHITE)")
          s = s.replace("draw_line(cx, cy - 9.0, cx, cy + 9.0, WHITE, 2.0)", "draw_line(cx, cy - 9.0, cx, cy + 9.0, 2.0, WHITE)")
          p.write_text(s)
          p = Path("src/terrain.rs")
          s = p.read_text().replace("let radius =", "let radius: i32 =")
          p.write_text(s)
          p = Path("src/renderer.rs")
          s = p.read_text().replace("Vertex { position, uv: vec2(0.0, 0.0), color }", "Vertex { position, uv: vec2(0.0, 0.0), color, normal: vec4(0.0, 0.0, 0.0, 0.0) }")
          p.write_text(s)
          PY
          grep -nE 'near:|far:|draw_line\(cx|let radius|Vertex \{ position' src/main.rs src/terrain.rs src/renderer.rs

      - name: Remove unsupported nested Android application metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Cargo.toml")
          lines = p.read_text().splitlines()
          try:
              start = lines.index("[package.metadata.android.application]")
          except ValueError:
              start = None
          if start is not None:
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("[")), len(lines))
              del lines[start:end]
              p.write_text("\n".join(lines) + "\n")
          PY
          sed -i 's/^package = /package_name = /' Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Cargo.toml")
          lines = p.read_text().splitlines()
          section = lines.index("[package.metadata.android]")
          next_section = next((i for i in range(section + 1, len(lines)) if lines[i].startswith("[")), len(lines))
          if not any(line.startswith("android_version =") for line in lines[section + 1:next_section]):
              lines.insert(section + 1, "android_version = 30")
          p.write_text("\n".join(lines) + "\n")
          PY
          if [ "${GITHUB_REF_NAME}" = "experiment/tree-generation" ]; then
            sed -i 's/^package_name = .*/package_name = "com.pocovoxelsandbox.game.v2"/' Cargo.toml
          fi
          echo '--- Normalized Android metadata ---'
          sed -n '24,40p' Cargo.toml

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Set compatible lockfile format for Android packager
        shell: bash
        run: |
          # cargo-quad-apk 0.1.4 uses an older Cargo parser that cannot read lockfile v4.
          # The generated dependency graph is compatible with lockfile format v3.
          sed -i 's/^version = 4$/version = 3/' Cargo.lock
          head -n 5 Cargo.lock

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk --locked

      - name: Build Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # The wrapper forwards GNU ld flags to Clang while retaining the NDK sysroot.
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN_BIN/aarch64-linux-android-ld"
          export CC_aarch64_linux_android="$TOOLCHAIN_BIN/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN_BIN/llvm-ar"
          "$TOOLCHAIN_BIN/aarch64-linux-android29-clang" --version
          "$TOOLCHAIN_BIN/aarch64-linux-android-ld" --version
          cargo --locked quad-apk build --release

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          APK="$(find target -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was generated. Build output follows:"
            find target -maxdepth 8 -type f | sort | tail -n 160
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'experiment/tree-generation' && 'poco-voxel-sandbox-v2-tree-fix-arm64-apk' || 'poco-voxel-sandbox-arm64-apk' }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
