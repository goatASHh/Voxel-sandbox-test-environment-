[package]
name = "poco_voxel_sandbox"
version = "0.2.0"
edition = "2021"
description = "Original Android-first creative voxel sandbox prototype"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
macroquad = "0.4.14"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[package.metadata.android]
android_version = 35
package_name = "com.pocovoxelsandbox.game"
label = "Poco Voxel Sandbox"
assets = "assets"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 26
target_sdk_version = 35
